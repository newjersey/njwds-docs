# Docs: https://docs.slack.dev/tools/slack-github-action/sending-techniques/sending-data-slack-api-method/

name: 'Slack Notification'

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_OAUTH_TOKEN }}
  CHANNEL_ID: C09Q36G9HMX # sandbox

jobs:
  get_assignees:
    runs-on: ubuntu-latest
    steps:
      - name: Log PR Assignees
        run: |
          ASSIGNESS_JSON='${{ toJson(github.event.pull_request.assignees) }}'
          echo "Assignees JSON: $ASSIGNESS_JSON"

          # Iterate through assignees and print their logins
          if [ "$ASSIGNESS_JSON" != "[]" ]; then
            echo "$ASSIGNESS_JSON" | jq -r '.[].login' | while read -r assignee; do
              echo "Assignee: $assignee"
            done
          else
            echo "No assignees found for this Pull Request."
          fi
  alert-slack:
    runs-on: ubuntu-latest
    steps:
      - name: Send message the Slack channel
        uses: slackapi/slack-github-action@v2
        id: slack_thread
        with:
            errors: true
            method: chat.postMessage
            token: ${{ env.SLACK_BOT_TOKEN }}
            payload: |
              channel: "${{ env.CHANNEL_ID }}"
              blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "[ <${{ github.event.pull_request.html_url }}|PR Review> ] ${{ github.event.repository.name }} - #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
      - name: Follow up message
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ env.CHANNEL_ID }}"
            thread_ts: "${{ steps.slack_thread.outputs.ts }}"
            text: "Inside the thread."