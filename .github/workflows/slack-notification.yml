# Docs: https://docs.slack.dev/tools/slack-github-action/sending-techniques/sending-data-slack-api-method/

name: 'Slack Notification'

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  alert-slack:
    runs-on: ubuntu-latest
    steps:
      - name: Send message the Slack channel
        uses: slackapi/slack-github-action@v2
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_OAUTH_TOKEN }}
          CHANNEL_ID: C09Q36G9HMX # sandbox
        with:
            errors: true
            method: chat.postMessage
            token: ${{ env.SLACK_BOT_TOKEN }}
            payload: |
              channel: "${{ env.CHANNEL_ID }}"
              blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "[ <${{ github.event.pull_request.url }}|PR Review> ] ${{ github.event.repository.name }} - #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
