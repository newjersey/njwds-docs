name: Pickaroo Reviewers

on:
  pull_request:
    types: ["labeled"]

jobs:
  # `pr-review` - add one eng in resx-eng
  pr-review:
    if: contains(github.event.pull_request.labels.*.name, 'pr-review')
    uses: newjersey/innovation-shared-actions/.github/workflows/pickaroo.yml@main # main
    secrets: inherit
    with:
      include_teams: "innovation-engineering-resx bloomicorn-platform-eng"
      exclude_teams: ""
      include_users: ""
      exclude_users: "catheraaine"
      number_of_reviewers: 1
      channel_id: "C0590CD1EE8" # resx-eng
      slack_as_author: true

  # `pr-show` - post in resx-eng
  pr-show:
    if: contains(github.event.pull_request.labels.*.name, 'pr-show')
    uses: newjersey/innovation-shared-actions/.github/workflows/pickaroo.yml@main # main
    secrets: inherit
    with:
      show: true
      channel_id: "C0590CD1EE8" # resx-eng
      slack_as_author: true